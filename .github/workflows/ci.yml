name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-lint-${{ runner.os }}-
      - run: pnpm turbo run lint
      - run: pnpm run format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-typecheck-${{ runner.os }}-
      - run: pnpm turbo run typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-unit-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-unit-${{ runner.os }}-
      - run: pnpm turbo run test
