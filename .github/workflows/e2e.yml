name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The test database is shared, so the group stays global: two runs never
# overlap, whatever branch they come from. Runs wait their turn instead of
# cancelling each other: a push on main gates its production deployment, so a
# pull request must never cancel it.
concurrency:
  group: e2e
  queue: max

jobs:
  e2e:
    # A pull request from a fork gets no secrets, so it would fail on boot.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      # The whole e2e environment lives in one secret, same shape as any other
      # env file of the project. Vite reads it through `--mode e2e`.
      # `printf` through the environment, never `echo` of the interpolation:
      # the shell would expand a `$` or a backtick sitting in a secret.
      - name: Write the e2e environment file
        env:
          E2E_ENV_FILE: ${{ secrets.E2E_ENV_FILE }}
        run: printf '%s\n' "$E2E_ENV_FILE" > .env.e2e

      - run: pnpm run prisma:migrate:e2e

      - run: pnpm run build:e2e

      - run: pnpm run test:e2e

      # The repository is public: traces carry session cookies, so they only
      # leave the runner when something failed, and not for long.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/.logs/
          include-hidden-files: true
          retention-days: 3
