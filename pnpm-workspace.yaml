trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyExclude:
  - '@tanstack/*'
  - '@vercel/cli-config@0.3.1'
  - '@vercel/cli-exec@1.0.1'
  - '@vercel/functions@3.10.1'
  - '@vercel/oidc@4.0.1'
  - 'prisma@7.10.1'
  - 'semver@6.3.1'

strictPeerDependencies: true
optimisticRepeatInstall: false

allowBuilds:
  '@google/genai': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  msw: true
  sharp: true

publicHoistPattern:
  - '@takumi-rs/core-*'

peerDependencyRules:
  allowedVersions:
    '@typescript-eslint/utils>typescript': '7'
    '@typescript-eslint/typescript-estree>typescript': '7'
    '@typescript-eslint/project-service>typescript': '7'
    '@typescript-eslint/tsconfig-utils>typescript': '7'

minimumReleaseAgeExclude:
  - '@tanstack/*'
  - '@viclafouch/*'
permissions:
  '@tanstack/ai':
    skills: false
  '@tanstack/charts':
    skills: false
  '@tanstack/markdown':
    skills: false
  '@tanstack/react-hotkeys':
    skills: false
  '@tanstack/react-router':
    skills: false
  '@tanstack/react-start':
    skills: false
  '@tanstack/react-table':
    skills: false
