trustPolicy: no-downgrade
trustPolicyExclude:
  - 'chokidar'
  - 'semver@6.3.1'
  - 'prisma@7.10.0'
  - '@vercel/functions@3.9.11'
  - '@vercel/oidc@4.0.0'
  - '@vercel/cli-config@0.3.1'
  - '@vercel/cli-exec@1.0.1'

blockExoticSubdeps: true
strictPeerDependencies: true

optimisticRepeatInstall: false
strictDepBuilds: true
allowBuilds:
  '@google/genai': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  prisma: true
  protobufjs: true
  msw: true
  sharp: true

publicHoistPattern:
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'
  - '@sentry/*'
  - '@takumi-rs/core-*'

overrides:
  require-in-the-middle: 7.4.0
  next: ^16.3.8

peerDependencyRules:
  allowedVersions:
    '@tanstack/eslint-plugin-query>typescript': '7'
    '@typescript-eslint/utils>typescript': '7'
    '@typescript-eslint/typescript-estree>typescript': '7'
    '@typescript-eslint/project-service>typescript': '7'
    '@typescript-eslint/tsconfig-utils>typescript': '7'
